services:
  sc-archive:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sc-archive-config:/app/config
      - sc-archive-userdata:/home/aegis/.config/sc-archive
      - sc-archive-workspaces:/home/aegis/sc-archive
      - sc-archive-blueprints:/app/blueprints
    environment:
      - AEGIS_ADMIN_PASSWORD=${AEGIS_ADMIN_PASSWORD:-}
      - OLLAMA_IP=${OLLAMA_IP:-http://host.docker.internal:11434}
    depends_on:
      gotenberg:
        condition: service_healthy

  gotenberg:
    # gotenberg/gotenberg:8, pinned by digest for reproducible builds (multi-arch, includes arm64)
    image: gotenberg/gotenberg:8@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  caddy:
    # caddy:alpine, pinned by digest for reproducible builds (multi-arch, includes arm64)
    image: caddy:alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      sc-archive:
        condition: service_healthy

volumes:
  sc-archive-config:
  sc-archive-userdata:
  sc-archive-workspaces:
  sc-archive-blueprints:
